[pytest]
# resmon test configuration.
#
# The suite is hermetic by default. Tests that reach the network, or bind a real
# socket, are marked ``live_network`` and excluded unless explicitly asked for,
# because they are slow and fail whenever a provider rate-limits or has an
# outage.
#
#   pytest                        hermetic suite (the default)
#   pytest -m live_network        every live test
#   pytest -m ""                  everything, including live
testpaths = resmon_scripts/verification_scripts

# ``live_network`` used to say "cannot run in CI". That was true of some of it
# and wrong about most of it, and being wrong about it is how a live test
# contradicting the shipped MCP contract stayed red on ``main`` for two releases
# with nobody hearing (2.0a *Decided* 8). The second marker draws the real line:
# a live test that needs something belonging to the *person* — a signed-in agent
# CLI — carries it, and everything else is run weekly by
# ``.github/workflows/live-network.yml``. The selection is computed from
# ``verification_scripts/live_suite.py``; ``test_live_suite.py`` fails if the
# two selections do not partition the live suite exactly, so a new live test
# cannot be neither.
markers =
    live_network: reaches the network, or binds a real socket. Excluded by default.
    needs_agent_cli: needs an agent CLI installed on this machine and signed in to the user's own subscription. No CI runner has one.

# A hung test must not be able to stall the whole run. thread is the only
# method that works with the threaded pipeline the backend uses.
addopts = -m "not live_network" --timeout=120
timeout_method = thread
