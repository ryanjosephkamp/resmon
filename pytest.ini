[pytest]
# resmon test configuration.
#
# The suite is hermetic by default. Tests that reach real third-party scholarly
# APIs are marked ``live_network`` and excluded unless explicitly asked for,
# because they are slow, fail whenever a provider rate-limits or has an outage,
# and cannot run in CI or offline at all.
#
#   pytest                        hermetic suite (the default)
#   pytest -m live_network        only the live third-party integration tests
#   pytest -m ""                  everything, including live
testpaths = resmon_scripts/verification_scripts

markers =
    live_network: issues real HTTP requests to external scholarly APIs (arXiv, CrossRef, OpenAlex, PubMed, bioRxiv, HAL, Semantic Scholar). Excluded by default.

# A hung test must not be able to stall the whole run. thread is the only
# method that works with the threaded pipeline the backend uses.
addopts = -m "not live_network" --timeout=120
timeout_method = thread
