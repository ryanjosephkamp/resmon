<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src http://127.0.0.1:* https://ryanjosephkamp.github.io; frame-src https://ryanjosephkamp.github.io https://www.youtube-nocookie.com https://www.youtube.com; child-src https://ryanjosephkamp.github.io https://www.youtube-nocookie.com https://www.youtube.com;" />
  <!--
    ``font-src 'self' data:`` is not decoration and it is not a loosening for its
    own sake. FullCalendar ships its icon font inline, as a
    ``data:application/x-font-ttf`` URL inside its own CSS. Without an explicit
    ``font-src`` the browser falls back to ``default-src 'self'``, blocks it, and
    the Calendar's previous/next chevrons -- ``fc-icon-chevron-left``, glyph
    U+E900 -- render as tofu squares. Delegation 09 saw exactly that on the
    published v1.8.7 installer and recorded the squares and the console error as
    two separate observations; they are one defect.

    ``data:`` is added for fonts only, never to ``default-src``. A font cannot
    execute script, and the alternative -- unpacking a vendor's base64 font to a
    file at build time -- is more machinery for the same result.
  -->
  <title>resmon</title>
</head>
<body>
  <div id="root"></div>
</body>
</html>
