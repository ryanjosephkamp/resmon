name: UI smoke

# The first thing in this repository that has ever launched the app.
#
# `ci.yml`'s frontend job typechecks, runs 154 jsdom tests and builds a bundle.
# None of that starts Electron, so `electron/main.ts` — 700-odd lines carrying
# every v1.8.3 interface fix — has never been executed by CI at all. This job
# launches the real app under Playwright on a virtual display and walks every
# route in `e2e/routes.ts`.
#
# Two jobs, because one runner cannot see the whole app.
#
#   smoke   ubuntu-latest under xvfb-run. Fast, free, and it verifies the
#           renderer thoroughly — but `xvfb-run` starts a bare X server with
#           NO WINDOW MANAGER, so maximize, focus and stacking are silent
#           no-ops there. The window-manager specs skip on this job and the
#           job summary says which ones and why. A green tick from this job
#           alone is not a statement about the window.
#
#   window  macos-15, with a real window server. Runs the same suite, so the
#           specs that skip above actually run. macOS minutes are free on a
#           public repository, which is what makes this worth having rather
#           than deferring it to a local run.
#
# The packaged-app spec skips on both, because building an installer downloads
# a Python runtime and takes minutes; it is exercised locally and its result is
# recorded in docs/ui-verification-feasibility.md.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      break_route:
        description: >-
          Append a route App.tsx does not declare, to demonstrate that this job
          fails when a route fails to load. Try "/no-such-page".
        required: false
        default: ''

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Route smoke (Electron under xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # No OS keyring on a runner. Same reasoning as ci.yml's backend job: every
      # credential read otherwise pays a timeout against a backend that cannot work.
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
      RESMON_KEYRING_TIMEOUT: '2.0'
      # The app spawns `python resmon.py <port>`; without this it would find the
      # runner's `python3` only if one is on PATH under that exact name.
      RESMON_PYTHON: python3
      RESMON_E2E_BREAK_ROUTE: ${{ github.event.inputs.break_route }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the backend's dependencies
        # The app under test spawns the real FastAPI backend. Without this the
        # window opens and every page reports "Backend: Offline".
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: resmon_scripts/frontend/package-lock.json

      - name: Install the renderer's dependencies
        # `npm install`, not `npm ci` — see the comment in ci.yml's frontend job.
        working-directory: resmon_scripts/frontend
        run: npm install --no-audit --no-fund

      - name: Install Electron's system libraries and a virtual display
        # Electron is Chromium, and a headless runner has none of the X, GTK,
        # NSS or DBus libraries it links against. `playwright install-deps
        # chromium` installs exactly that set — it is used here for the app's
        # own Electron, not to download a browser: `_electron.launch()` runs the
        # Electron already in node_modules and downloads nothing.
        working-directory: resmon_scripts/frontend
        run: |
          sudo npx playwright install-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Typecheck the e2e sources
        # The repo tsconfig covers src/** only, and Playwright's runner
        # transpiles without typechecking, so nothing else looks at e2e/.
        working-directory: resmon_scripts/frontend
        run: npm run typecheck:e2e

      - name: Build the renderer and the Electron main process
        working-directory: resmon_scripts/frontend
        run: npm run build

      - name: Launch the app and walk every route
        working-directory: resmon_scripts/frontend
        # A fixed virtual display, so the screenshots this uploads are all taken
        # at a size that is written down. The window itself is fixed at
        # 1440x900 by RESMON_E2E; the display has to be at least that.
        # `tee` so the summary step below can read what the suite reported
        # skipping. `set -o pipefail` keeps the job red when the suite fails —
        # without it the exit code would be tee's.
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24' \
            npm run e2e 2>&1 | tee "$RUNNER_TEMP/ui-smoke.log"

      - name: Say what this job did not verify
        # The suite prints a NOT VERIFIED line for every arm it skipped, and a
        # job that swallows those is a green tick that means less than it looks
        # like. This puts them in the run summary, where they are read.
        if: always()
        working-directory: resmon_scripts/frontend
        run: |
          {
            echo "### What the xvfb job did not verify"
            echo
            echo "\`xvfb-run\` starts a bare X server with **no window manager**, so"
            echo "maximize, focus and window stacking are no-ops here. The lines below"
            echo "are what the suite itself reported skipping."
            echo
            echo '```'
            grep -h 'NOT VERIFIED' "$RUNNER_TEMP/ui-smoke.log" || echo "(none reported)"
            echo '```'
            echo
            echo "The **window** job on macOS runs the same specs on a real window server."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: resmon_scripts/frontend/e2e/screenshots/
          if-no-files-found: warn

      - name: Upload the failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-failures
          path: resmon_scripts/frontend/e2e/test-results/
          if-no-files-found: ignore

  window:
    name: Window behaviour (Electron on macOS)
    runs-on: macos-15
    timeout-minutes: 30

    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
      RESMON_KEYRING_TIMEOUT: '2.0'
      RESMON_PYTHON: python3
      RESMON_E2E_BREAK_ROUTE: ${{ github.event.inputs.break_route }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the backend's dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: resmon_scripts/frontend/package-lock.json

      - name: Install the renderer's dependencies
        working-directory: resmon_scripts/frontend
        run: npm install --no-audit --no-fund

      - name: Build the renderer and the Electron main process
        working-directory: resmon_scripts/frontend
        run: npm run build

      - name: Run the whole suite on a real window server
        working-directory: resmon_scripts/frontend
        # No xvfb and no wrapper: a macOS runner has a window server, which is
        # the entire reason this job exists. `RESMON_PYTHON` is resolved to an
        # absolute path by the specs that scrub PATH.
        #
        # `set -o pipefail` is not decoration. Without it this job's exit code
        # is `tee`'s, and the first run of it reported **green with two failing
        # tests** — a job that cannot go red is not a gate, which is the exact
        # class of defect this phase exists to prevent.
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee "$RUNNER_TEMP/ui-window.log"

      - name: Say what this job did not verify
        if: always()
        run: |
          {
            echo "### What the macOS window job did not verify"
            echo
            echo '```'
            grep -h 'NOT VERIFIED' "$RUNNER_TEMP/ui-window.log" || echo "(none reported)"
            echo '```'
            echo
            echo "This runner has a window server, so maximize and stacking are"
            echo "observable here in a way they are not under xvfb. It is still a"
            echo "headless CI session: a spec that needs the app to be the frontmost"
            echo "application reports rather than asserts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-window-screenshots
          path: resmon_scripts/frontend/e2e/screenshots/
          if-no-files-found: warn

      - name: Upload the failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-window-failures
          path: resmon_scripts/frontend/e2e/test-results/
          if-no-files-found: ignore
