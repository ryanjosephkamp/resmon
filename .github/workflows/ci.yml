name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the README advertises. 3.12 is here as the
        # acceptance test for BUG-020: the backend used to share one
        # sqlite3.Connection between request threads and execution worker
        # threads, and 3.12 releases the GIL around sqlite3 far more
        # aggressively than 3.11, so that race failed reliably there and
        # intermittently everywhere else. Each thread now opens its own
        # connection. If this column ever goes red again, suspect connection
        # sharing first.
        python-version: ['3.10', '3.11', '3.12']

    env:
      # No OS keyring exists on a CI runner. Without this, credential reads fall
      # through to a backend that cannot work and every lookup pays the timeout.
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
      RESMON_KEYRING_TIMEOUT: '2.0'
      # Deliberately NOT setting RESMON_DISABLE_SCHEDULER: thirteen tests in
      # test_scheduler_lifecycle.py and test_routine_scheduler_sync.py assert on
      # a live scheduler and fail when it is disabled.

    steps:
      - uses: actions/checkout@v4

      # The cumulative upgrade test regenerates each released fixture from that
      # release's own code and diffs it against the committed file. The
      # checkout above is depth 1 and carries no tags, so fetch those tags
      # (depth 1 is enough for a worktree of each) and tell the test that a
      # missing tag is a failure here, not a skip. One tag per released
      # fixture: the list here and `RELEASED` in
      # verification_scripts/test_cumulative_upgrade.py grow together.
      - name: Fetch the released tags for the fixture-provenance checks
        run: |
          for tag in v2.1.0 v2.2.0; do
            git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify every module parses
        # Catches a syntax error hidden behind a missing dependency — a module
        # nothing imports on the happy path can stay broken indefinitely otherwise.
        run: python -m compileall -q resmon_scripts/

      - name: Verify the backend imports from a clean install
        # requirements.txt shipped without python-dateutil, so a fresh clone
        # could not start at all. This step fails immediately if that recurs.
        run: |
          PYTHONPATH=resmon_scripts python -c "import resmon; print('desktop backend OK')"

      - name: Run the hermetic test suite
        # pytest.ini deselects the live_network marker by default, so this never
        # touches a third-party API.
        #
        # -v rather than -q on purpose: pytest-timeout's dump does not name the
        # item it killed, so a hang in quiet mode leaves only a row of dots to
        # count. With -v the last line printed is the last test that finished,
        # which names the culprit immediately.
        env:
          # One switch per released fixture, each turning "the tag is not here"
          # from a skip into a failure. A new release adds its own rather than
          # widening an existing one: a single flag would have to mean "every
          # tag", and the first tag that failed to fetch would take the others
          # down with it without saying which one was missing.
          RESMON_REQUIRE_V210_TAG: '1'
          RESMON_REQUIRE_V220_TAG: '1'
        run: pytest -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: resmon_scripts/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, matching package.json's engines and .nvmrc. It was '20' until
          # the trim PR: 20 is @playwright/test@1.62.1's declared floor, and
          # sitting exactly on a dependency's floor is not a place to stay.
          node-version: '22'
          cache: npm
          cache-dependency-path: resmon_scripts/frontend/package-lock.json

      - name: Install dependencies
        # `npm install`, not `npm ci`. npm omits other platforms' optional
        # dependencies from the lockfile - the @emnapi/* WASM fallbacks - so a
        # lockfile generated on macOS makes `npm ci` fail on the Linux runner
        # with "Missing: @emnapi/core from lock file".
        #
        # This comment used to blame tailwindcss for those fallbacks. It was
        # wrong, and the trim PR that removed tailwindcss proved it: the chain
        # is jest-resolve -> unrs-resolver -> @unrs/resolver-binding-wasm32-wasi
        # -> @napi-rs/wasm-runtime -> @emnapi/*, every link a devDependency of
        # jest. That family (@emnapi/*, @unrs/*, @napi-rs/*) is 27 lockfile
        # entries; removing tailwindcss left 26 of them in place - the one that
        # went was a hoisted duplicate of a nested @emnapi/* that is still
        # there - so `npm install` stays.
        #
        # The lockfile is still committed and still honoured for everything it
        # does pin; this only relaxes the strict-equality check that npm itself
        # cannot satisfy across platforms.
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Renderer tests
        run: npm test

      - name: Build renderer and Electron main
        run: npm run build
