name: Release

# Builds the installable artifacts — macOS DMG, Windows NSIS installer,
# Linux AppImage — and attaches them to a GitHub Release.
#
# Triggers on version tags (v1.6.0, v2.0.0, ...) and manually via
# workflow_dispatch for a dry run that uploads the DMG as a workflow
# artifact instead of creating a release.
#
# Signing and notarization are environment-gated: when the four APPLE_*
# / CSC_* secrets exist, electron-builder signs with the Developer ID
# certificate and notarizes with Apple; when they are absent (as now,
# before enrolment), the build completes unsigned — same behaviour as a
# local `npm run dist`. Adding the secrets later upgrades the pipeline
# to signed without a workflow change.
#
# The v1.5-classic tag predates this workflow and is deliberately not a
# release: it is the Master Plan rule-R1 archive marker.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing must not cancel the others' artifacts.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS DMG (arm64)
            artifact: resmon-dmg-arm64
            # No update metadata on purpose: an unsigned macOS app cannot
            # self-update (Squirrel.Mac validates the signature), so shipping
            # latest-mac.yml would advertise updates the app cannot apply.
            pattern: release/*.dmg
            verify: '! test -e release/latest-mac.yml'
          - os: windows-latest
            label: Windows installer (x64)
            artifact: resmon-setup-x64
            # latest.yml is what installed apps poll; the blockmap enables
            # differential downloads.
            pattern: release/*.exe release/*.exe.blockmap release/latest.yml
            verify: >-
              test -f release/latest.yml &&
              ls release/*.exe.blockmap &&
              test -f release/win-unpacked/resources/app-update.yml
          - os: ubuntu-latest
            label: Linux AppImage (x64)
            artifact: resmon-appimage-x64
            pattern: release/*.AppImage release/latest-linux.yml
            verify: >-
              test -f release/latest-linux.yml &&
              test -f release/linux-unpacked/resources/app-update.yml

    defaults:
      run:
        working-directory: resmon_scripts/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # prepare-backend.js bundles whichever Python it finds; pin the
          # version the venv is developed against.
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: resmon_scripts/frontend/package-lock.json

      - name: Install dependencies
        # npm install, not ci — same cross-platform lockfile caveat as ci.yml.
        run: npm install --no-audit --no-fund

      - name: Configure macOS signing
        # A job-level CSC_LINK mapped from a secret DEFINES the variable even
        # when the secret does not exist, and electron-builder then attempts
        # file-based signing against an empty path ("... not a file" — the
        # first dry run failed exactly this way). So signing env is exported
        # only when the certificate secret actually has a value; otherwise
        # signing is disabled outright, matching a local unsigned build.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${{ secrets.MAC_CSC_LINK }}" ]; then
            {
              echo "CSC_LINK=${{ secrets.MAC_CSC_LINK }}"
              echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CSC_KEY_PASSWORD }}"
              echo "APPLE_ID=${{ secrets.APPLE_ID }}"
              echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
              echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            } >> "$GITHUB_ENV"
            echo "Signing configured from secrets."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No certificate secret; building unsigned."
          fi

      - name: Build
        # `npm run dist` targets the platform it runs on. Each build stages
        # the full Python backend venv (~900 MB) before packing.
        run: npm run dist

      - name: Verify update metadata
        # Auto-update is only as real as its supply line. This fails the
        # build if the updater feed files or the embedded app-update.yml
        # are missing where they must exist — or present where they must
        # not (unsigned macOS).
        shell: bash
        run: ${{ matrix.verify }}

      - name: Upload to the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "resmon ${GITHUB_REF_NAME}" \
            --generate-notes \
            ${{ matrix.pattern }} \
          || gh release upload "${GITHUB_REF_NAME}" \
               --repo "${GITHUB_REPOSITORY}" --clobber ${{ matrix.pattern }}

      - name: Upload as workflow artifact (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: resmon_scripts/frontend/${{ matrix.pattern }}
          retention-days: 7
